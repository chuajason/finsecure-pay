# Example only. The real Secret is created on the cluster with kubectl and is never committed:
#   kubectl -n finsecure create secret generic finsecure-pay-secrets \
#     --from-literal=FINSECURE_API_KEY=<value>
# The application reads FINSECURE_API_KEY from the environment; /health reports
# apiKeyConfigured: true when it is present, without ever exposing the value.
# The Deployment marks the Secret as required, so pods will not start without it.
# This demonstrates secret injection; it is not request authentication.
apiVersion: v1
kind: Secret
metadata:
  name: finsecure-pay-secrets
  namespace: finsecure
type: Opaque
stringData:
  FINSECURE_API_KEY: "replace-me-do-not-commit-real-values"
