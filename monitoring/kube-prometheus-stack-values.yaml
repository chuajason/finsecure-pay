# Helm values for kube-prometheus-stack (release name: monitoring, namespace: monitoring).
# Email credentials are NOT in this file: they are passed with --set at install time
# from environment variables (see docs/RUNBOOK.md, step 6.2).
grafana:
  adminPassword: "REPLACE_AT_INSTALL"      # overridden with --set grafana.adminPassword
  service:
    type: LoadBalancer
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard

prometheus:
  prometheusSpec:
    retention: 3d
    serviceMonitorSelectorNilUsesHelmValues: false   # pick up our ServiceMonitor in finsecure
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }

alertmanager:
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: "REPLACE_SMTP_FROM"
      smtp_auth_username: "REPLACE_SMTP_FROM"
      smtp_auth_password: "REPLACE_AT_INSTALL"      # --set alertmanager.config.global.smtp_auth_password
      smtp_require_tls: true
    route:
      receiver: email-ops
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 2m
      repeat_interval: 4h
      routes:
        - receiver: email-ops
          matchers: ["namespace = finsecure"]
    receivers:
      - name: email-ops
        email_configs:
          - to: "REPLACE_NOTIFY_EMAIL"
            send_resolved: true

# Keep the cluster small: disable components the demo does not need.
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
