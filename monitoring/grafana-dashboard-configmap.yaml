apiVersion: v1
kind: ConfigMap
metadata:
  name: finsecure-pay-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  finsecure-pay.json: "{\n  \"title\": \"FinSecure Pay\",\n  \"uid\": \"finsecure-pay\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"refresh\": \"10s\",\n  \"time\": {\n    \"from\": \"now-30m\",\n    \"to\": \"now\"\n  },\n  \"tags\": [\n    \"finsecure\"\n  ],\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\": \"Request rate by status (req/s)\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(http_server_requests_seconds_count{application=\\\"finsecure-pay\\\"}[1m])) by (status)\",\n          \"legendFormat\": \"{{status}}\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"id\": 2,\n      \"title\": \"Validation outcomes (per second)\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 0,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(finsecure_validations_total[1m])) by (result)\",\n          \"legendFormat\": \"{{result}}\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"id\": 3,\n      \"title\": \"p95 and p50 latency on /validate\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 8,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application=\\\"finsecure-pay\\\",uri=\\\"/validate\\\"}[5m])) by (le))\",\n          \"legendFormat\": \"p95\",\n          \"refId\": \"A\"\n        },\n        {\n          \"expr\": \"histogram_quantile(0.50, sum(rate(http_server_requests_seconds_bucket{application=\\\"finsecure-pay\\\",uri=\\\"/validate\\\"}[5m])) by (le))\",\n          \"legendFormat\": \"p50\",\n          \"refId\": \"B\"\n        }\n      ]\n    },\n    {\n      \"id\": 4,\n      \"title\": \"Rejection rate (2m)\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 8,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(finsecure_validations_total{result=\\\"rejected\\\"}[2m])) / clamp_min(sum(rate(finsecure_validations_total[2m])),0.001)\",\n          \"legendFormat\": \"rejected share\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"id\": 5,\n      \"title\": \"Available replicas\",\n      \"type\": \"stat\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 16,\n        \"w\": 8,\n        \"h\": 6\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"kube_deployment_status_replicas_available{namespace=\\\"finsecure\\\",deployment=\\\"finsecure-pay\\\"}\",\n          \"legendFormat\": \"available\",\n          \"refId\": \"A\"\n        }\n\
    \      ]\n    },\n    {\n      \"id\": 6,\n      \"title\": \"JVM heap used\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"x\": 8,\n        \"y\": 16,\n        \"w\": 16,\n        \"h\": 6\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"bytes\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(jvm_memory_used_bytes{application=\\\"finsecure-pay\\\",area=\\\"heap\\\"}) by (pod)\",\n          \"legendFormat\": \"{{pod}}\",\n          \"refId\": \"A\"\n        }\n      ]\n    }\n  ]\n}"
