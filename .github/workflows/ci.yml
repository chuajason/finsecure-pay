# Build verification on GitHub Actions. Jenkins is the deployment pipeline for the
# capstone; this workflow only proves the code compiles, tests pass, the image builds
# and the scanners are clean on every push, so a broken commit is caught early.
name: build-verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: |
          set -o pipefail
          if ! mvn -B -ntp verify 2>&1 | tee build.log; then
            # Surface the first errors as annotations so they are visible without the raw log
            grep -E "ERROR|Tests run:.*Failures: [1-9]|Tests run:.*Errors: [1-9]" build.log | grep -v "^\[ERROR\] *$" | head -30 | while IFS= read -r line; do echo "::error::${line:0:300}"; done
            exit 1
          fi

      - name: Static analysis (SpotBugs)
        run: mvn -B -ntp spotbugs:check

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Build container image
        run: docker build --build-arg APP_VERSION=ci-${GITHUB_SHA::7} -t finsecure-pay:ci .

      - name: Run container and check /health
        run: |
          docker run -d --name app -p 8080:8080 finsecure-pay:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health && break; sleep 2; done
          curl -fsS http://localhost:8080/health
          curl -s -X POST http://localhost:8080/validate -H 'Content-Type: application/json' \
            -d "{\"transactionId\":\"ci-1\",\"accountId\":\"acc-1\",\"amount\":120.50,\"currency\":\"SGD\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
          echo
          docker logs app | tail -5
          docker rm -f app

      - name: Trivy repository scan (dependencies, secrets, misconfiguration)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: json
          output: trivy-fs.json
          exit-code: "0"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: finsecure-pay:ci
          severity: HIGH,CRITICAL
          format: json
          output: trivy-image.json
          exit-code: "0"

      - name: Security gate (CRITICAL blocks, same policy as Jenkins)
        run: |
          python3 - <<'PY'
          import json, sys
          crit = 0
          for f in ("trivy-fs.json", "trivy-image.json"):
              try:
                  data = json.load(open(f))
              except FileNotFoundError:
                  continue
              for r in data.get("Results", []):
                  for v in r.get("Vulnerabilities", []) or []:
                      sev = v.get("Severity")
                      msg = f"{f}: {r.get('Target')} {v.get('PkgName')} {v.get('InstalledVersion')} {v.get('VulnerabilityID')} {sev} fixed={v.get('FixedVersion','')}"
                      print(("::error::" if sev == "CRITICAL" else "::warning::") + msg)
                      if sev == "CRITICAL":
                          crit += 1
                  for m in r.get("Misconfigurations", []) or []:
                      print(f"::warning::{f}: {r.get('Target')} {m.get('ID')} {m.get('Severity')} {m.get('Title')}")
                  for sct in r.get("Secrets", []) or []:
                      print(f"::error::{f}: {r.get('Target')} secret {sct.get('RuleID')} line {sct.get('StartLine')}")
                      crit += 1
          print(f"CRITICAL findings: {crit}")
          sys.exit(1 if crit else 0)
          PY
